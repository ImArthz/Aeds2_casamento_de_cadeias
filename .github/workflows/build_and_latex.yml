name: Build C++ Benchmarks & Compile LaTeX Report

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cpp-and-latex:
    name: Build C++17 & Compile LaTeX PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile and Run C++17 Implementation
        run: |
          mkdir -p bin benchmarks
          g++ -std=c++17 -O3 -Wall -Wextra -Iinclude src/main.cpp src/casamento_cadeias.cpp src/fasta_io.cpp -o bin/casamento_cadeias
          ./bin/casamento_cadeias

      - name: Compile LaTeX Report (Monografia + Cheat Sheet)
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/relatorio_latex
          root_file: relatorio_casamento_cadeias.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Publish PDF Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Relatorio Tecnico e Implementacao C++ - Casamento de Cadeias (v1.0.${{ github.run_number }})"
          body: |
            Entrega do Trabalho Teorico-Pratico de Projeto e Analise de Algoritmos (AEDS II - CEFET-MG Divinopolis):
            - Implementacao de Referencia em C++17 (Busca Ingenua, Rabin-Karp e Knuth-Morris-Pratt) aplicada a sequencias genomicas do NCBI (`NC_045512.2` e `NM_000546.6`).
            - Relatorio Tecnico-Cientifico compilado em PDF (incluindo Apendice Cheat Sheet).
          files: |
            docs/relatorio_latex/relatorio_casamento_cadeias.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
